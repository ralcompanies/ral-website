capabilities:
  - key: design
    title: Designer
    text: >-
      RAL began as an architecture firm and still plans every project from the floor plan out.
      Our architects and designers work alongside the design teams we hire, so decisions about
      layout, materials and cost are made together from the first sketch.
  - key: develop
    title: Developer
    text: >-
      We acquire, finance, entitle, build and manage. RAL has taken projects from site selection
      to sell-out across condominiums, rentals, hotels, offices and planned communities, and has
      a reputation for delivering on schedule and on budget.
  - key: partner
    title: Partner
    text: >-
      Owners, lenders, operators and public agencies bring RAL in when a project is complex. We
      have won competitive public RFPs, represented ownership on Four Seasons renovations and
      stepped in for lenders to see projects through to opening.
leadership_quote:
  text: Look for a sponsor's history. Longevity in the market matters. We have been delivering since the '70s.
  person: robert-a-levine
press_count: 4
internal_notes:
  - "Quote from Robert Levine interview, Off the MRKT (Nov 2024). Confirm he's comfortable with it on the homepage."
