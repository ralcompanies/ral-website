capabilities:
  - key: design
    title: Designer
    text: >-
      RAL began as an architecture firm and still plans every project from the floor plan out.
      Our in-house architects work hand in hand with each project's consultants, so layout,
      materials and cost are decided together from the first sketch.
  - key: develop
    title: Developer
    text: >-
      We acquire, finance, entitle, build and manage. RAL has taken projects from site selection
      to sell-out across condominiums, rentals, hotels, offices and planned communities, and has
      a reputation for delivering on schedule and on budget.
  - key: partner
    title: Partner
    text: >-
      Owners, lenders, operators and public agencies bring RAL in when a project is complex. We
      have won competitive public RFPs, represented owners on everything from ground-up development
      and conversions to resorts and luxury hotels, and stepped in for lenders to see projects
      through to completion.
leadership_quote:
  text: "Real estate is a long-term business. A developer isn't measured by one project, but by the quality of what you build and the relationships you earn over decades."
  person: robert-a-levine
press_count: 4
internal_notes:
  - "Homepage quote chosen by Josh (Sept 2026); new wording, not from a published interview. Confirm Robert has approved it before launch."
